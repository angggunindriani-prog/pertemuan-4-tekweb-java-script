<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Tugas praktikum 4.css">
    <script src="Tugas praktikum 4.js" defer></script>

</head>
<body>
    <div class="container">
        <h1>Kalkulator Sederhana</h1>
        <p>Masukkan dua angka untuk melakukan perhitungan ya browww sistt.</p>

        <input type="number" id="angka1" placeholder="Masukkan angka pertama">
        <input type="number" id="angka2" placeholder="Masukkan angka kedua">

        <div class="tombol">
            <button type="button" data-operator="+">+</button>
            <button type="button" data-operator="-">-</button>
            <button type="button" data-operator="*">×</button>
            <button type="button" data-operator="/">÷</button>
        </div>

        <h3>Hasil: <span id="hasil">-</span></h3>
    </div>

    
</body>
</html>
