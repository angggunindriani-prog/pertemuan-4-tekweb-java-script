<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="latiahan 4.css">
</head>
<body>
    <div class="container">
        <h1>Welcome!</h1>
        <p class="subtitle">Silakan isi data diri kamu 💗</p>

        <div id="output4"></div>
    </div>

    <script>
        // Membuat form
        let form = document.createElement("form");

        // Input nama
        let labelNama = document.createElement("label");
        labelNama.textContent = "Nama:";

        let inputNama = document.createElement("input");
        inputNama.type = "text";
        inputNama.id = "nama";
        inputNama.placeholder = "Masukkan nama kamu";

        // Input email
        let labelEmail = document.createElement("label");
        labelEmail.textContent = "Email:";

        let inputEmail = document.createElement("input");
        inputEmail.type = "email";
        inputEmail.id = "email";
        inputEmail.placeholder = "Masukkan email kamu";

        // Tombol submit
        let btnSubmit = document.createElement("button");
        btnSubmit.type = "button";
        btnSubmit.textContent = "Submit ♡";

        // Area pesan error
        let errorDiv = document.createElement("div");
        errorDiv.id = "error-message";

        // Validasi form
        btnSubmit.onclick = function() {
            let nama = inputNama.value;
            let email = inputEmail.value;
            let errorMessage = "";

            if (nama.trim() === "") {
                errorMessage += "Nama tidak boleh kosong. ";
            }

            if (email.indexOf("@") === -1) {
                errorMessage += "Email harus mengandung @. ";
            }

            if (errorMessage !== "") {
                errorDiv.textContent = errorMessage;
                errorDiv.style.color = "#d6336c";
            } else {
                errorDiv.textContent =
                    "Form valid! Data berhasil dikirim 💗";
                errorDiv.style.color = "#218838";
            }
        };

        // Menambahkan elemen ke form
        form.appendChild(labelNama);
        form.appendChild(inputNama);
        form.appendChild(document.createElement("br"));

        form.appendChild(labelEmail);
        form.appendChild(inputEmail);
        form.appendChild(document.createElement("br"));

        form.appendChild(btnSubmit);
        form.appendChild(errorDiv);

        // Menambahkan form ke output
        let outputDiv = document.getElementById("output4");
        outputDiv.appendChild(form);
    </script>

</body>
</html>
